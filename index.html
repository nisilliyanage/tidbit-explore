<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#ffffff">
<title>Lumen</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">

<style id="css">
:root{--bg:#fff;--fg:#121316;--muted:#767a83;--line:#e4e6e9;--btn:#eef0f2;--accent:#0e9e90;--link:#1d5fa8;--ring:#0e9e90;--ring2:#f0b54a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f2f3f5;--muted:#9a9ea7;--line:#25272b;--btn:#1e2023;--link:#8ab8ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--fg:#f2f3f5;--muted:#9a9ea7;--line:#25272b;--btn:#1e2023;--link:#8ab8ff;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg .f{fill:currentColor;stroke:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;user-select:none}
.wm{font-family:"Fredoka",ui-rounded,-apple-system,"Segoe UI",sans-serif;font-size:27px;font-weight:600;letter-spacing:-.01em;line-height:1}
.handle{display:flex;align-items:center;gap:2px;font-weight:700;font-size:21px;letter-spacing:-.01em}
.handle svg{width:18px;height:18px}
.ticons{display:flex;gap:20px}
main{flex:1}
/* stories */
.stories{display:flex;gap:14px;padding:6px 14px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.stories::-webkit-scrollbar{display:none}
.sto{width:68px;flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}
.sto>span{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sring{width:68px;height:68px;border-radius:50%;padding:2.5px;background:linear-gradient(45deg,var(--ring2),var(--ring))}
.sring.mine{background:none;border:1px solid var(--line);padding:3px}
.simg{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center;border:2.5px solid var(--bg)}
.sring.mine .simg{border:0}
/* posts */
.post{padding-bottom:16px}
.phead{display:flex;align-items:center;gap:10px;padding:8px 14px}
.pav{width:32px;height:32px;border-radius:50%;background-size:cover;background-position:center;flex:none}
.car{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.pimg{flex:0 0 100%;aspect-ratio:4/5;background-size:cover;background-position:center;scroll-snap-align:start;scroll-snap-stop:always;user-select:none}
.count{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:12px;pointer-events:none}
.burst{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.4);pointer-events:none;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
.burst svg{width:96px;height:96px;fill:#fff;stroke:#fff}
.burst.go{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(.95)}45%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.burst.go{animation-duration:.01s}}
.acts{position:relative;display:flex;gap:16px;padding:10px 14px;align-items:center}
.dots{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.sp{flex:1}
.ib{background:none;border:0;color:inherit;padding:0;display:grid;place-items:center}
.like.on svg{fill:#ed4956;stroke:#ed4956}
.save.on svg{fill:currentColor}
.pmeta{padding:0 14px}
.pmeta p{margin:4px 0}
.muted{color:var(--muted)}
.pedit{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pedit button{border:1px dashed var(--accent);background:none;color:var(--fg);border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600}
/* explore */
.sbar{flex:1;display:flex;gap:8px;align-items:center;background:var(--btn);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:15px}
.sbar svg{width:18px;height:18px}
.xgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:calc((min(100vw,480px) - 4px) / 3 * 4 / 3);grid-auto-flow:dense;gap:2px}
.tile{background-size:cover;background-position:center;position:relative;cursor:pointer}
.multi{position:absolute;top:6px;right:6px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.multi svg{width:20px;height:20px}
/* profile */
.prof{display:flex;align-items:center;gap:22px;padding:6px 16px 0}
.avatar{width:86px;height:86px;border-radius:50%;background-size:cover;background-position:center;flex:none}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stat b{display:block;font-size:17px;font-weight:700}
.stat span{font-size:13px}
.bio{padding:12px 16px 0}
.name{font-weight:600}
.biotext{white-space:pre-line}
.link{color:var(--link);font-weight:500;display:inline-block}
.btns{display:flex;gap:6px;padding:14px 16px 0}
.b{flex:1;border:0;border-radius:9px;background:var(--btn);color:var(--fg);font-size:14px;font-weight:600;padding:9px 0}
.b.pri{background:var(--accent);color:#fff}
.b.sq{flex:none;width:36px;display:grid;place-items:center;padding:0}
.b.sq svg{width:18px;height:18px}
.hl{display:flex;gap:16px;padding:16px;overflow-x:auto;scrollbar-width:none}
.hl::-webkit-scrollbar{display:none}
.hli{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;width:66px;flex:none;text-align:center}
.ring{width:66px;height:66px;border-radius:50%;padding:2px;border:1.5px solid var(--line)}
.hlimg{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center}
.tabs{display:flex;border-top:1px solid var(--line)}
.tab{flex:1;display:flex;justify-content:center;padding:10px 0;color:var(--muted);border-bottom:1px solid transparent}
.tab.on{color:var(--fg);border-bottom-color:var(--fg)}
.tab svg{width:24px;height:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cell{aspect-ratio:3/4;background-size:cover;background-position:center;position:relative;cursor:pointer}
/* nav + overlay */
.bnav{position:sticky;bottom:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 26px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.nav{background:none;border:0;padding:0;color:var(--fg);display:grid;place-items:center}
.nav.on svg{stroke-width:2.7}
.me{width:27px;height:27px;border-radius:50%;background-size:cover;background-position:center}
.nav.on .me{outline:2px solid var(--fg);outline-offset:1px}
.viewer{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);max-width:480px;margin:0 auto}
.vtop{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);user-select:none}
.vt{text-align:center;line-height:1.15}
.vt small{display:block;font-size:12px}
.vscroll{flex:1;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
/* edit mode */
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#fff1bf;color:#3a2c00;font-size:12px;box-shadow:0 -2px 12px rgba(0,0,0,.15)}
.editbar .hint{width:100%;text-align:center;font-weight:600}
.editbar button{border:0;border-radius:7px;padding:7px 10px;background:rgba(0,0,0,.08);font-size:12px;font-weight:600;color:inherit}
.editbar button.pri{background:#3a2c00;color:#fff1bf}
.editing main{padding-bottom:90px}
.editing .vscroll{padding-bottom:110px}
.editing .ed{outline:1px dashed var(--accent);outline-offset:2px;border-radius:3px;min-width:14px;display:inline-block}
.editing .name.ed,.editing .biotext.ed{display:block}
.editing [data-img]{outline:2px dashed var(--accent);outline-offset:-2px;cursor:pointer}
.cbtn,.del{position:absolute;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:17px;display:grid;place-items:center;padding:0}
.del{top:4px;right:4px}
.cbtn{bottom:4px;right:4px}
.cbtn svg{width:17px;height:17px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.editing [data-vid]{outline:2px dashed var(--accent);outline-offset:-4px;cursor:pointer}
/* reels */
.rwrap{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.rscroll{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.rscroll::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden}
.rmedia{position:absolute;inset:0}
.rmedia video{width:100%;height:100%;object-fit:cover;display:block}
.sheen{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);background-size:250% 100%;animation:sheen 3.2s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
.reel::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none;z-index:1}
.rtop{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;font-size:22px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4);user-select:none}
.rtop .ib{color:#fff}
.rside{position:absolute;right:10px;bottom:20px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:16px;font-size:12px;font-weight:600;text-align:center}
.rside .ib{color:#fff}
.rside svg{width:29px;height:29px}
.rstat{display:flex;flex-direction:column;align-items:center;gap:3px}
.rinfo{position:absolute;left:14px;right:72px;bottom:18px;z-index:3}
.rside,.rinfo{text-shadow:0 1px 3px rgba(0,0,0,.45)}
.ruser{display:flex;align-items:center;gap:8px;font-weight:600}
.rfol{background:none;border:1px solid rgba(255,255,255,.85);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.rcap{margin-top:8px;font-size:14px}
.raudio{margin-top:6px;font-size:13px;display:flex;gap:6px;align-items:center}
.rau{width:28px;height:28px;border-radius:7px;border:2px solid #fff;background-size:cover;background-position:center}
.solo .rside,.solo .rinfo{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.rwrap .burst{z-index:4}
.mute{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);border-radius:50%;width:64px;height:64px;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:4}
.mute.show{opacity:1}
.rwrap .bnav{background:#000;border-top-color:#222}
.rwrap .nav{color:#fff}
.rwrap .nav.on .me{outline-color:#fff}
.editing .rside,.editing .rinfo{bottom:120px}
.rdel{margin-top:8px;border:1px dashed #fff;background:none;color:#fff;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600}
/* content manager */
#mgr{position:relative;z-index:50}
.mback{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
.msheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;height:88%;z-index:51;background:var(--bg);color:var(--fg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.mhead{display:flex;align-items:center;padding:14px 16px 8px;font-size:17px}
.mtabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.mtabs::-webkit-scrollbar{display:none}
.mtabs button{flex:none;border:0;border-radius:999px;padding:7px 12px;background:var(--btn);color:var(--fg);font-size:13px;font-weight:600}

.mmsg{padding:8px 16px;background:var(--accent);color:#fff;font-size:13px;font-weight:600}
.mbody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.mcard,.mitem{border:1px solid var(--line);border-radius:12px;padding:12px;flex:none}
.mcard h4{margin:0 0 4px;font-size:15px}
.mnote{margin:0 0 6px;color:var(--muted);font-size:13px}
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mbtn{border:0;border-radius:9px;padding:9px 12px;background:var(--btn);color:var(--fg);font-size:13px;font-weight:600}
.mbtn.pri{background:var(--accent);color:#fff}
.mbtn.warn{color:#d33}
.mih{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mtag{font-size:12px;color:var(--muted)}
.mic{width:34px;height:34px;border:0;border-radius:8px;background:var(--btn);color:var(--fg);font-size:15px;padding:0}
.mthumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.th{flex:none;width:64px;height:80px;border-radius:8px;border:1px dashed var(--line);background-size:cover;background-position:center;color:#fff;font-size:20px;font-weight:600;padding:0;overflow:hidden;position:relative;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.th.add{background:var(--btn);color:var(--fg);font-size:12px;text-shadow:none}
.th.round{width:56px;height:56px;border-radius:50%}
.vth{width:72px;height:128px;font-size:12px;background:#222}
.vth video{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.mgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mf{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);margin-top:8px}
.mgrid2 .mf{margin-top:0}
.mf input,.mf textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--btn);border:1px solid transparent;border-radius:8px;padding:8px 10px;width:100%;resize:vertical}
.mf input:focus,.mf textarea:focus{outline:none;border-color:var(--accent)}
.thx{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:22px;text-align:center}
.mlist{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.mside{display:flex;gap:10px;align-items:flex-start}
.mside>div{flex:1;min-width:0}
/* photo reels */
.rphoto{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 14s ease-in-out infinite alternate;will-change:transform}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
@media (prefers-reduced-motion:reduce){.rphoto{animation:none}}
.rmedia{overflow:hidden}
/* text on video */
.reel,.tile,.vth{container-type:size}
.rtext{position:absolute;transform:translate(-50%,-50%);z-index:2;text-align:center;width:max-content;max-width:86cqw;font-size:calc(var(--s) * 100cqw / 390);line-height:1.2;color:var(--c);pointer-events:none;white-space:pre-wrap;overflow-wrap:break-word}
.st-clean{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.st-box{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-weight:700;line-height:1.5}
.st-box span{background:var(--bx);padding:.14em .42em;border-radius:.3em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.st-strong{font-family:"Anton",Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.01em;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.st-type{font-family:"Courier Prime","Courier New",monospace;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.st-hand{font-family:"Caveat",cursive;font-weight:700;font-size:calc(var(--s) * 1.3 * 100cqw / 390);text-shadow:0 1px 4px rgba(0,0,0,.4)}
.st-neon{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-weight:800;color:#fff;text-shadow:0 0 .12em var(--c),0 0 .45em var(--c),0 0 .9em var(--c)}
.editing .reel .rtext{pointer-events:auto;outline:1.5px dashed rgba(255,255,255,.9);outline-offset:4px;cursor:move;touch-action:none}
.txlayer{position:absolute;inset:0;pointer-events:none}
.mtx{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.mtxi{background:var(--btn);border-radius:10px;padding:10px;margin-top:8px}
.mtxi textarea{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--fg);resize:vertical}

.mchip.on{outline:2px solid var(--accent);outline-offset:1px}
.msw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.msw.on{outline:2px solid var(--accent);outline-offset:2px}
.mf input[type=range]{padding:0;background:none;accent-color:var(--accent)}

 const act=t.dataset.act,post=t.closest('.post,.reel'),ppath=post&&post.dataset.p;
 if(act){
  if(act!=='reset')resetArm=false;
  if(act==='follow'){followed=!followed;render()}
  else if(act==='close'){overlay=null;render()}
  else if(act==='like')setLike(ppath,!getPath(ppath).liked)
  else if(act==='save'){const p=getPath(ppath);p.saved=!p.saved;save();t.classList.toggle('on',p.saved)}
  else if(act==='mode'){S.mode=S.mode==='own'?'visitor':'own';save();render()}
  else if(act==='theme'){S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];save();render()}
  else if(act==='addslide'){const p=getPath(ppath);p.slides.push({img:null,h:Math.floor(Math.random()*360)});save();render();pick(d=>{p.slides[p.slides.length-1].img=d})}
  else if(act==='rmslide'){const p=getPath(ppath);if(p.slides.length>1)p.slides.pop();save();render()}
  else if(act==='mgr'){openMgr()}
  else if(act==='rfollow'){t.textContent=t.textContent==='Follow'?'Following':'Follow'}
  else if(act==='delreel'){S.reels.splice(+ppath.split('.')[1],1);overlay=null;save();render()}
  else if(act==='delpost'){S.feed.splice(+ppath.split('.')[1],1);overlay=null;save();render()}
  else if(act==='add'){
   const h=Math.floor(Math.random()*360);
   if(view==='reels'||(overlay&&overlay.reels)){S.reels.unshift({user:'new.account',av:null,avh:h,h,vid:null,caption:'New reel',audio:'Original audio',likes:'0',comments:'0',shares:'0',liked:false});overlay=null;if(view!=='reels'){view='reels';try{location.hash='reels'}catch(e){}}save();render();const nr=document.querySelector('.rscroll');if(nr)nr.scrollTop=0;pickVideo(0)}
   else if(view==='profile'){S.grid.unshift({img:null,hue:h,caption:'New post',likes:'0',time:'1h',liked:false,saved:false});save();render();pick(d=>{S.grid[0].img=d})}
   else{S.feed.unshift({user:'new.account',av:null,avh:h,slides:[{img:null,h}],caption:'New post',likes:'0',comments:'0',time:'1h',liked:false,saved:false});overlay=null;save();render();window.scrollTo(0,0);pick(d=>{S.feed[0].slides[0].img=d})}
  }
  else if(act==='reset'){if(resetArm){S=clone(DEFAULT);clearVids();resetArm=false;overlay=null;save()}else resetArm=true;render()}
  else if(act==='done'){editing=false;render()}
  return;
 }
 if(t.dataset.vid!==undefined){if(editing){pickVideo(+t.dataset.vid.split('.')[1]);return}reelTap(post,ppath);return}
 if(t.dataset.img!==undefined){
  if(editing){const path=t.dataset.img;pick(d=>setPath(path,d));return}
  if(t.classList.contains('pimg')&&ppath){const n=Date.now();if(n-lastTap.t<320&&lastTap.p===ppath){setLike(ppath,true);const b=post.querySelector('.burst');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');lastTap={t:0,p:''}}else lastTap={t:n,p:ppath}}
  return;
 }
 if(t.classList.contains('cell')){const i=+t.dataset.i;overlay={title:'Posts',sub:S.handle,own:true,items:S.grid.map((_,j)=>'grid.'+j).slice(i)};render();return}
 if(t.classList.contains('tile')){
  if(t.dataset.r!==undefined){const R=S.reels.length,s=+t.dataset.r;overlay={reels:true,order:[...Array(R).keys()].map(j=>(j+s)%R)};render();return}
  const N=S.feed.length,s=+t.dataset.x;overlay={title:'Explore',own:false,items:[...Array(N).keys()].map(j=>'feed.'+((j+s)%N))};render();return}
});
function pickVideo(i){pick(f=>{const r=S.reels[i];if(r)setReelMedia(r,f)},'image/*,video/*')}
let rTap=null;
function reelTap(el,path){
 if(rTap&&rTap.p===path){clearTimeout(rTap.t);rTap=null;setLike(path,true);const b=el.querySelector('.burst');b.classList.remove('go');void b.offsetWidth;b.classList.add('go');return}
 rTap={p:path,t:setTimeout(()=>{rTap=null;muted=!muted;document.querySelectorAll('.reel video').forEach(v=>v.muted=muted);document.querySelectorAll('.mute').forEach(m=>m.innerHTML=muted?I.volOff:I.volOn);const m=el.querySelector('.mute');m.classList.add('show');setTimeout(()=>m.classList.remove('show'),700)},280)};
}

  <div class="mside" style="margin-top:8px">${th(p.av,p.avh,`data-m="img" data-path="feed.${i}.av"`,'round')}<div>${fld('Account','feed.'+i+'.user')}</div></div>

 if(mgrTab==='reels'){

 if(mgrTab==='profile'){

function renderMgr(){
 if(!mgrOpen){M.innerHTML='';return}
 const sc=M.querySelector('.mbody'),top=sc?sc.scrollTop:0;
 const tabs=[['fill','Quick fill'],['posts','Posts'],['reels','Reels'],['profile','Her profile'],['stories','Stories']];
 M.innerHTML=`<div class="mback" data-m="close"></div><div class="msheet" role="dialog" aria-label="Edit content"><div class="mhead"><b>Edit content</b><span class="sp"></span><button class="mbtn pri" data-m="close">Done</button></div>
 <div class="mtabs">${tabs.map(([k,l])=>`<button class="${mgrTab===k?'on':''}" data-mtab="${k}">${l}</button>`).join('')}</div>
 ${mgrMsg?`<div class="mmsg">${esc(mgrMsg)}</div>`:''}<div class="mbody">${mgrBody()}</div></div>`;
 const nb=M.querySelector('.mbody');if(nb)nb.scrollTop=top;
 M.querySelectorAll('.vth video').forEach(v=>v.muted=true);
}
const rh=()=>Math.floor(Math.random()*360);
const pickUser=()=>USERS[Math.floor(Math.random()*USERS.length)];
function newPost(n){const [u,ah]=pickUser(),b=rh();return{user:u,av:null,avh:ah,slides:Array.from({length:n},(_,k)=>({img:null,h:(b+k*38)%360})),caption:'',likes:String(100+Math.floor(Math.random()*3000)),comments:String(Math.floor(Math.random()*90)+2),time:'1h',liked:false,saved:false}}
function newReel(){const [u,ah]=pickUser();return{user:u,av:null,avh:ah,h:rh(),vid:null,caption:'',audio:u+' · Original audio',likes:String(200+Math.floor(Math.random()*9000)),comments:String(Math.floor(Math.random()*300)+5),shares:String(Math.floor(Math.random()*200)+1),liked:false}}
function setVid(r,f){const k='v'+Date.now()+Math.random().toString(36).slice(2,6);putVid(k,f);VURL[k]=URL.createObjectURL(f);r.vid=k;r.vidFile=null;r.img=null}
function setReelMedia(r,x){if(typeof x==='string'){r.img=x;r.vid=null;r.vidFile=null}else setVid(r,x)}
const hasMedia=r=>!!(vurl(r)||r.img);
const flash=t=>{mgrMsg=t;renderMgr();setTimeout(()=>{if(mgrMsg===t){mgrMsg='';renderMgr()}},2500)};
M.addEventListener('click',e=>{
 const tb=e.target.closest('[data-mtab]');if(tb){mgrTab=tb.dataset.mtab;mgrMsg='';renderMgr();const b=M.querySelector('.mbody');if(b)b.scrollTop=0;return}
 const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m,item=b.closest('[data-mp]'),ip=item&&item.dataset.mp;
 if(m!=='reset')mReset=false;
 if(m==='close'){closeMgr();return}
 if(m==='export'){exportSite();return}
 if(m==='tx-add'){const r=getPath(ip);r.texts=r.texts||[];r.texts.push({t:'Your text',style:'clean',color:'#ffffff',size:28,x:50,y:40});save();render();renderMgr();return}
 if(m.startsWith('tx-')){const tp=b.closest('[data-tp]').dataset.tp,x=getPath(tp);
  if(m==='tx-style')x.style=b.dataset.v;else if(m==='tx-color')x.color=b.dataset.v;else if(m==='tx-pos'){x.y=+b.dataset.v;x.x=50}
  else if(m==='tx-del'){const k=tp.split('.');getPath(k.slice(0,3).join('.')).splice(+k[3],1)}
  save();render();renderMgr();return}
 if(m==='img'){const path=b.dataset.path;pick(d=>setPath(path,d));return}
 if(m==='vid'){const r=S.reels[+b.dataset.i];pick(f=>setReelMedia(r,f),'image/*,video/*');return}
 if(m==='grid-del'){e.stopPropagation();S.grid.splice(+b.dataset.i,1);save();render();renderMgr();return}
 if(m==='up'||m==='down'||m==='del'){const [c,i]=ip.split('.'),a=S[c],n=+i;if(m==='del')a.splice(n,1);else{const j=m==='up'?n-1:n+1;if(j<0||j>=a.length)return;[a[n],a[j]]=[a[j],a[n]]}overlay=null;save();render();renderMgr();return}
 if(m==='addslide'){getPath(ip).slides.push({img:null,h:rh()});save();renderMgr();const p=getPath(ip);pick(d=>{p.slides[p.slides.length-1].img=d});return}
 if(m==='rmslide'){const p=getPath(ip);if(p.slides.length>1)p.slides.pop();save();renderMgr();return}
 if(m==='add-post'||m==='add-car'){const car=m==='add-car';S.feed.unshift(newPost(1));save();renderMgr();pickMany(fs=>{const p=S.feed[0];if(!fs.length)return;p.slides=fs.slice(0,car?10:1).map(d=>({img:d,h:rh()}))});return}
 if(m==='add-reel'){S.reels.unshift(newReel());save();renderMgr();pick(f=>setReelMedia(S.reels[0],f),'image/*,video/*');return}
 if(m==='add-grid'){S.grid.unshift({img:null,hue:rh(),caption:'',likes:'0',time:'1h',liked:false,saved:false});save();renderMgr();pick(d=>{S.grid[0].img=d});return}
 if(m==='add-story'){const [u,h]=pickUser();S.stories.unshift({user:u,img:null,h});save();renderMgr();pick(d=>{S.stories[0].img=d});return}

 if(m==='fill-feed'||m==='fill-feed-all'){const all=m==='fill-feed-all';pickMany(fs=>{let slots=feedSlots();if(!all)slots=slots.filter(s=>!s.img);let k=0;slots.forEach(s=>{if(k<fs.length)s.img=fs[k++]});while(k<fs.length){const p=newPost(1);p.slides[0].img=fs[k++];S.feed.push(p)}flash(`Added ${fs.length} photo${fs.length===1?'':'s'}`)});return}
 if(m==='fill-reels'||m==='fill-reels-all'){const all=m==='fill-reels-all';pickMany(fs=>{let rs=S.reels;if(!all)rs=rs.filter(r=>!hasMedia(r));let k=0;rs.forEach(r=>{if(k<fs.length)setReelMedia(r,fs[k++])});while(k<fs.length){const r=newReel();setReelMedia(r,fs[k++]);S.reels.push(r)}flash(`Added ${fs.length} reel${fs.length===1?'':'s'}`)},'image/*,video/*');return}
 if(m==='fill-grid'||m==='fill-grid-all'){const all=m==='fill-grid-all';pickMany(fs=>{let gs=S.grid;if(!all)gs=gs.filter(g=>!g.img);let k=0;gs.forEach(g=>{if(k<fs.length)g.img=fs[k++]});while(k<fs.length)S.grid.push({img:fs[k++],hue:rh(),caption:'',likes:String(50+Math.floor(Math.random()*400)),time:'1w',liked:false,saved:false});flash(`Added ${fs.length} photo${fs.length===1?'':'s'}`)});return}

});

function setMsg(t){mgrMsg=t;const el=M.querySelector('.mmsg');if(el)el.textContent=t;else renderMgr()}
function iconBlob(s){return new Promise(res=>{const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');x.fillStyle='#0e9e90';x.fillRect(0,0,s,s);x.strokeStyle='#fff';x.lineWidth=s*.07;x.beginPath();x.arc(s/2,s/2,s*.28,0,7);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(s/2,s/2,s*.09,0,7);x.fill();c.toBlob(res,'image/png')})}
function buildIndex(){
 const css=document.getElementById('css').textContent,js=document.getElementById('appjs').textContent;
 return `<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#ffffff">
<title>${esc(S.app)}</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Anton&family=Courier+Prime:wght@700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style id="css">${css}</style></head><body><div id="app"></div><input type="file" id="picker" accept="image/*" hidden>
<script>window.BAKED=true<\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"><\/script>
<script id="appjs">${js}<\/script></body></html>`;
}
async function saveFile(name,blob){
 let dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads')}catch(e){}
 if(dl){await dl.save({filename:name,data:blob});return}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
}
let exporting=false;
async function exportSite(){
 if(exporting)return;
 if(typeof JSZip==='undefined'){flash('The export tool didn’t load. Check your internet and reopen the page.');return}
 exporting=true;setMsg('Packing your feed…');
 try{
  const zip=new JSZip(),C=clone(S),byData=new Map(),fetched=new Map();let ni=0,nv=0;const jobs=[];
  const walk=o=>{if(!o||typeof o!=='object')return;for(const k in o){const v=o[k];
   if(typeof v==='string'&&v.startsWith('data:image/')){let n=byData.get(v);if(!n){n=`media/img-${++ni}.jpg`;byData.set(v,n);zip.file(n,v.split(',')[1],{base64:true})}o[k]=n}
   else if(typeof v==='string'&&/^media\//.test(v)&&k!=='vidFile'){if(!fetched.has(v)){fetched.set(v,1);jobs.push(fetch(v).then(r=>r.blob()).then(b=>zip.file(v,b)).catch(()=>{}))}}
   else walk(v)}};
  walk(C);
  for(const r of C.reels){const u=r.vid&&VURL[r.vid];
   if(u){setMsg(`Packing video ${nv+1}…`);const b=await (await fetch(u)).blob();const ext=/webm/.test(b.type)?'webm':/quicktime/.test(b.type)?'mov':'mp4';const n=`media/vid-${++nv}.${ext}`;zip.file(n,b);r.vidFile=n}
   else if(r.vidFile&&!fetched.has(r.vidFile)){const f=r.vidFile;fetched.set(f,1);jobs.push(fetch(f).then(x=>x.blob()).then(b=>zip.file(f,b)).catch(()=>{}))}
   r.vid=null}
  await Promise.all(jobs);
  C.bakeId=String(Date.now());
  zip.file('content.json',JSON.stringify(C));
  zip.file('index.html',buildIndex());
  zip.file('manifest.webmanifest',JSON.stringify({name:S.app,short_name:S.app,start_url:'./index.html#home',scope:'./',display:'fullscreen',background_color:'#ffffff',theme_color:'#ffffff',icons:[{src:'icon-192.png',sizes:'192x192',type:'image/png'},{src:'icon-512.png',sizes:'512x512',type:'image/png'}]}));
  zip.file('icon-192.png',await iconBlob(192));zip.file('icon-512.png',await iconBlob(512));
  let last=-1;const blob=await zip.generateAsync({type:'blob'},m=>{const pc=Math.floor(m.percent);if(pc!==last){last=pc;setMsg(`Packing… ${pc}%`)}});
  setMsg('Saving…');
  await saveFile('lumen-site.zip',blob);
  flash('Exported. Unzip it and drop the folder on Netlify.');
 }catch(e){flash(e&&e.code==='declined'?'Export cancelled':'Couldn’t export: '+((e&&(e.message||e.code))||'unknown error'))}
 finally{exporting=false}
}

let drag=null;

document.addEventListener('pointermove',e=>{if(!drag)return;const b=drag.reel.getBoundingClientRect(),x=Math.max(5,Math.min(95,(e.clientX-b.left)/b.width*100)),y=Math.max(5,Math.min(95,(e.clientY-b.top)/b.height*100));drag.el.style.left=x+'%';drag.el.style.top=y+'%';const o=getPath(drag.path);if(o){o.x=Math.round(x*10)/10;o.y=Math.round(y*10)/10}});
document.addEventListener('pointerup',()=>{if(drag){drag=null;save()}});
